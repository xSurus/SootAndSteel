name: Unity Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      # Without a license the Unity container cannot activate, so skip instead of failing.
      # Add the UNITY_LICENSE secret (a .ulf file) in the repo settings to turn the tests on.
      - name: Skip when no Unity license is configured
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::UNITY_LICENSE secret is not set, skipping Unity tests."
      - uses: actions/checkout@v4
        if: env.UNITY_LICENSE != ''
        with:
          lfs: true
      - uses: actions/cache@v4
        if: env.UNITY_LICENSE != ''
        with:
          path: Unity/Library
          key: Library-${{ hashFiles('Unity/Assets/**', 'Unity/Packages/**', 'Unity/ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        if: env.UNITY_LICENSE != ''
        with:
          projectPath: Unity
          testMode: EditMode
