<svg xmlns="http://www.w3.org/2000/svg" width="600" height="40" viewBox="0 0 600 40">
  <!-- Slider Track (Empty) - the container that holds the fill -->
  <defs>
    <pattern id="ticks" x="0" y="0" width="20" height="40" patternUnits="userSpaceOnUse">
      <line x1="20" y1="6" x2="20" y2="34" stroke="#3a2a1a" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Inner fill area background (very subtle paper tone) -->
  <rect x="2" y="2" width="596" height="36" fill="#d9c79a" opacity="0.25"/>

  <!-- Tick marks across the whole track -->
  <rect x="2" y="2" width="596" height="36" fill="url(#ticks)"/>

  <!-- Outer border -->
  <rect x="1" y="1" width="598" height="38" fill="none" stroke="#3a2a1a" stroke-width="1.5" opacity="0.85"/>

  <!-- Subtle inner shadow on top edge -->
  <rect x="2" y="2" width="596" height="3" fill="#3a2a1a" opacity="0.08"/>
</svg>
